<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Itemwise"><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script><script src="supabase.js"></script><script src="platform.js"></script>
</head><body>
<title>Itemwise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one column, summary strip on top, tabs below. The split editor is styled as a paper receipt. */
:root{
  --bg:#F5F7F4; --surface:#FFFFFF; --ink:#15201B; --muted:#5A6760; --line:#DCE2DD;
  --accent:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#E6ECFB;
  --warn:#8F5400; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE4E1; --ok:#1B7A4B; --ok-soft:#DFF2E7;
  --paper:#FCFBF5; --paper-line:#CFCBB8; --paper-ink:#25241D; --neutral:#7C8A83;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --surface:#161E1A; --ink:#E7EEEA; --muted:#97A59D; --line:#27322D;
    --accent:#82A6FF; --accent-ink:#0B1330; --accent-soft:#1B2745;
    --warn:#F0B35A; --warn-soft:#33270F; --bad:#FF8F85; --bad-soft:#3A1A17; --ok:#6FD39D; --ok-soft:#14301F;
    --paper:#1D231F; --paper-line:#3A443E; --paper-ink:#E3E6DA; --neutral:#7F8E86; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E1A; --ink:#E7EEEA; --muted:#97A59D; --line:#27322D;
  --accent:#82A6FF; --accent-ink:#0B1330; --accent-soft:#1B2745;
  --warn:#F0B35A; --warn-soft:#33270F; --bad:#FF8F85; --bad-soft:#3A1A17; --ok:#6FD39D; --ok-soft:#14301F;
  --paper:#1D231F; --paper-line:#3A443E; --paper-ink:#E3E6DA; --neutral:#7F8E86; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:24px;letter-spacing:-.01em}
.demo-tag{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.on{background:var(--bad);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.small{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent}
.notice{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;background:var(--warn-soft);color:var(--warn)}

.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-family:var(--font-display);font-weight:600}
.monthbar .btn{padding:2px 10px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:16px}
.strip .cell{padding:12px 16px;min-width:0;display:flex;flex-direction:column;gap:2px}
.strip .cell+.cell{border-left:1px solid var(--line)}
.strip .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.strip b{font-family:var(--font-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strip small{color:var(--muted);font-size:13px}
.strip .attn b{color:var(--warn)}
.strip a.cell{color:inherit;text-decoration:none}.strip a.cell:hover{background:var(--accent-soft)}
a.btn{text-decoration:none;color:inherit;display:inline-block}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:thin}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .only-m{display:none}
.count{background:var(--warn-soft);color:var(--warn);border-radius:99px;font-size:12px;font-weight:600;padding:0 7px;line-height:20px}

.lede{margin:0 0 16px;max-width:68ch;color:var(--muted)}
.lede strong{color:var(--ink);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{font-size:16px}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card-top h3{font-size:18px;overflow-wrap:anywhere}
.meta{margin:2px 0 0;color:var(--muted);font-size:13px}
.amt{font-family:var(--font-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.neg{color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.actions label,.field{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:110px;font-family:var(--font-mono);font-size:12.5px;resize:vertical}
.sp{flex:1}
.remember{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.remember input[type=text]{width:190px;font-family:var(--font-mono);font-size:12.5px;text-transform:uppercase}

.panel{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.panel h3{font-size:15px;margin-bottom:6px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:14px;max-width:70ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:99px;white-space:nowrap}
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 16px;color:var(--muted);text-align:center}
.empty .actions{justify-content:center}

/* Receipt-style editor */
.receipt{margin-top:14px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;padding:14px 14px 12px;font-family:var(--font-mono);font-size:13px}
.receipt select,.receipt input[type=text],.receipt textarea{background:transparent;border-color:var(--paper-line);color:var(--paper-ink);font-family:var(--font-mono);font-size:12.5px;padding:4px 6px}
.receipt .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px dashed var(--paper-line);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.receipt .head span:first-child{overflow-wrap:anywhere}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto 130px 24px;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--paper-line)}
.ln .nm{min-width:0;overflow-wrap:anywhere}
.ln .pr{text-align:right;font-variant-numeric:tabular-nums}
.ln.add{border-bottom:0;padding-top:10px}
.ln input.amt-in{width:84px;text-align:right}
.tbtn{font-family:var(--font-mono);font-size:10px;margin-left:6px;border:1px solid currentColor;border-radius:3px;padding:0 4px;background:transparent;color:inherit;opacity:.35}
.tbtn.on{opacity:.9}
.tag{font-style:normal;font-size:11px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-body)}
.x{border:0;background:transparent;font-size:16px;line-height:1;color:var(--paper-ink);opacity:.6;padding:2px}
.x:hover{opacity:1}
.sum{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:10px 0 4px;margin-left:auto;max-width:300px;font-variant-numeric:tabular-nums}
.sum span:nth-child(even){text-align:right}
.sum .big{font-weight:500;border-top:1px dashed var(--paper-line);padding-top:4px}
.status{font-family:var(--font-body);font-size:13px;margin:8px 0 0;padding:8px 10px;border-radius:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-family:var(--font-body)}
.foot label{display:flex;gap:6px;align-items:center;font-size:13px}
.receipt .btn{background:var(--surface);color:var(--ink);font-family:var(--font-body)}
.receipt .btn.primary{background:var(--accent);color:var(--accent-ink)}
.addgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;margin:12px 0 4px}.addgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.addgrid input,.addgrid select{font-size:15px;color:var(--ink)}
.gblock{padding:10px 0;border-top:1px solid var(--line)}
.gblock:first-of-type{border-top:0}
.ghead2{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;margin-bottom:6px;flex-wrap:wrap}
.ghead2 .mono{white-space:nowrap}
.mono.big{font-size:17px;font-weight:600}
.cset{padding:2px 0 8px;margin-bottom:6px;border-bottom:1px dashed var(--line)}
.cset .actions{margin-top:6px;align-items:center}
.catbtn{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;font-weight:500}
.catbtn:hover{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.catbtn .chev{font-size:11px;color:var(--muted,#667);width:10px;display:inline-block}
.catlist{margin:0 0 6px 16px;padding:4px 0 6px;border-left:2px solid var(--line);padding-left:12px}
.centry{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:8px;font-size:13px;padding:3px 0;align-items:baseline}
.centry .cd{color:var(--muted,#667);font-family:var(--font-mono)}
.centry .cn{overflow-wrap:anywhere}
.centry em{font-style:normal;color:var(--muted,#667);font-size:12px}
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:6px}
.gname{border:0;background:transparent;font-family:var(--font-display);font-weight:600;font-size:16px;padding:0;text-align:left}
.gsum{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chipstat.neu{background:var(--line);color:var(--ink)}
.incrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn{cursor:pointer;display:inline-flex;align-items:center}
.rc{padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}.rc:first-child{border-top:0}.rc>b{display:block;margin-bottom:4px;word-break:break-all}.rc .actions select{max-width:100%}
.pastebox{margin:10px 0 4px;font-family:var(--font-body)}
.pastebox p{margin:0 0 6px;font-size:13px;opacity:.8}

/* Budgets */
.stackbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin:10px 0 8px}
.stackbar .a{background:var(--ok);margin-right:2px}
.stackbar.over .a{background:var(--bad)}
.stackbar .p{background:repeating-linear-gradient(135deg,var(--neutral) 0 3px,transparent 3px 6px)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:6px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.bname{font-weight:500;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.chipstat{font-size:12px;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.chipstat.good{background:var(--ok-soft);color:var(--ok)}
.chipstat.bad{background:var(--bad-soft);color:var(--bad)}
.track{position:relative;height:10px}
.track .bg{position:absolute;inset:0;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.fill{height:100%;background:var(--ok);flex:none;margin-right:2px}
.fill.over{background:var(--bad);margin-right:0}
.pend{height:100%;flex:none;background:repeating-linear-gradient(135deg,var(--neutral) 0 3px,transparent 3px 6px)}
.pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px;opacity:.55}
.lim{border:0;background:transparent;padding:0 2px;font-family:var(--font-mono);font-size:13px;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px}
.cols{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px}
.lcwrap{position:relative}
.lcwrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.lcwrap text{font-family:var(--font-body);font-size:12px;fill:var(--muted)}
.lcwrap text.ink{fill:var(--ink);font-weight:600}
.lctip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.4;white-space:nowrap;opacity:0;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.lctip.on{opacity:1}
.crow{display:grid;grid-template-columns:104px minmax(0,1fr) 84px 38px;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.crow .ctrack{height:8px;background:transparent}
.crow .ctrack i{display:block;height:100%;background:var(--neutral);border-radius:2px 4px 4px 2px;min-width:2px}
.crow .ctrack i.hatch{background:repeating-linear-gradient(135deg,var(--neutral) 0 3px,transparent 3px 6px)}
.crow .cv{text-align:right}.crow .cp{text-align:right;color:var(--muted);font-size:12px}
.place{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;border-top:1px solid var(--line)}
.place:first-of-type{border-top:0}
.sub{font-size:13px;font-weight:600;margin:16px 0 4px;color:var(--ink)}
.trends{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.trend{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.trend svg{display:block;width:100%;height:34px}
.trend b{font-weight:500;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{text-align:left;padding:4px 8px;border-top:1px solid var(--line)}.tbl th{font-size:12px;color:var(--muted);font-weight:500;border-top:0}.tbl td.r,.tbl th.r{text-align:right}
@media (min-width:820px){.cols{grid-template-columns:1.25fr 1fr}}
.bnum{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.bnum .line1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--ink)}
.bnum input{width:78px;text-align:right}
.left-over{color:var(--bad);font-weight:500}

/* Rows */
.arow{display:grid;gap:4px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .d{color:var(--muted);font-size:13px}
.arow .who{min-width:0}
.arow .who b{font-weight:500;overflow-wrap:anywhere}
.arow .who div{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.arow{grid-template-columns:56px minmax(0,1fr) auto 34px}
.arow .more{padding:2px 0;width:34px;font-weight:700;letter-spacing:.05em}
.arow .catline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.arow select{font-size:13px;padding:3px 6px;min-width:150px;max-width:100%}
.raw{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:1px 0 0}
.card .raw{margin:3px 0 0}
.rowmenu{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 12px 70px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 0 10px;scrollbar-width:thin}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.edwrap{padding:0 0 14px}
.grow{display:grid;grid-template-columns:56px minmax(0,1fr) auto 140px;gap:4px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.grow:first-child{border-top:0}
.grow .d{color:var(--muted);font-size:13px}
.grow .who{min-width:0;overflow-wrap:anywhere}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 140px auto auto;gap:8px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rrow input[type=text]{font-family:var(--font-mono);font-size:12.5px;text-transform:uppercase}
.learned{display:flex;gap:8px;flex-wrap:wrap}
.learned span{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 12px;font-size:13px}
.learned button{border:0;background:var(--line);border-radius:99px;width:20px;height:20px;line-height:1;color:var(--ink)}

/* Import */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;margin:10px 0}
.mapgrid label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.mapgrid select{font-size:14px;color:var(--ink)}
.radios{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-size:14px}
.radios label{display:flex;gap:6px;align-items:center}
.scroll{overflow-x:auto}
table.prev{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
table.prev th,table.prev td{text-align:left;padding:5px 8px;border-top:1px solid var(--line)}
table.prev th{font-size:12px;color:var(--muted);font-weight:500;border-top:0}
table.prev td.r,table.prev th.r{text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(520px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast{display:flex;align-items:center;gap:12px}.toast.show{opacity:1;pointer-events:auto}
.toast button{background:transparent;border:1px solid currentColor;border-radius:6px;padding:2px 10px;color:inherit;font-weight:600}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:680px){
  .wrap{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

function parseMoney(s){

}

function iso(y,m,d){ if(!(m>=1&&m<=12&&d>=1&&d<=31&&y>=1900&&y<=2200)) return ''; return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0') }
function parseDate(s){

}
function parseCSV(text){

  const cnt=ch=>(first.split(ch).length-1);

/* Banks often put an account line above the real header, so look for the row that names the columns. */
function findHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length,12);i++){
    const r=rows[i];
    if(r.length>=3&&r.some(c=>/date/i.test(c))&&r.some(c=>/desc|memo|payee|detail|name|amount|debit|credit|withdraw|deposit/i.test(c))&&r.every(c=>!parseDate(c))) return i;

}
const dataRows=(rows,m)=>m.hasHeader?rows.slice(m.headerRow+1):rows;

function buildRows(rows,m,negIsSpend){

}

  const u=String(desc).toUpperCase().replace(/[#*]\s*[\w-]*\d[\w-]*/g,' ')
    .replace(/\b(POS|DEBIT|CARD|PURCHASE|CHECKCARD|CHECK|VISA|ACH|WITHDRAWAL|PMT|PAYMENT|ONLINE|RECURRING|SQ|SP|TST|PAYPAL|DDA|PIN|PUR|CNP|QSR|CD\d*)\b/g,' ')
    .replace(/\d+/g,' ').replace(/[^A-Z&'\- ]/g,' ').replace(/\s+/g,' ').trim();

function applyDeposit(id,rows){

function evaluateTx(t,S){

function apportion(total,weights){
  const s=sum(weights);
  if(!s||!total) return weights.map(()=>0);
  const raw=weights.map(w=>total*w/s),out=raw.map(Math.floor);
  let left=total-sum(out);
  raw.map((r,i)=>({i,f:r-out[i]})).sort((a,b)=>b.f-a.f||a.i-b.i).forEach(o=>{if(left>0){out[o.i]++;left--}});

}

  scanAI.json(scanPrompt(t),{images:[file],signal:ctl.signal}).then(r=>{
    if(draft!==d0||scanCtl!==ctl)return;
    const d=rcNormalize(r),lines=rcLines(d,fallbackCat(t));
    if(!lines.length){d0.scan={err:'No items could be read from that photo. Try a clearer shot, or paste the receipt text.'};render();return}
    lines.forEach(l=>draft.lines.push(l));
    if(d.tax>0)draft.tax=d.tax;
    d0.scan=null;d0.paste=false;render();
    let msg=`Read ${lines.length} item${lines.length===1?'':'s'} from the photo.`;
    if(d.total!==null&&d.total!==t.cents)msg+=` The receipt total is ${fmt(d.total)} but the bank charge is ${fmt(t.cents)}, so check this is the right receipt.`;
    else msg+=' Check them against the receipt, then save.';
    toast(msg);
  }).catch(e=>{
    if(draft!==d0||scanCtl!==ctl)return;
    if(e&&e.code==='cancelled'){d0.scan=null;render();return}
    d0.scan={err:SCAN_ERR[e&&e.code]||SCAN_ERR.upstream_error};render();
  });
}

/* ---------- Import tab: receipt photos matched to bank charges ---------- */
let rcs=[],rcSeq=0,rcBusy=false,rcCtl=null,pend=null;
function rcCandidates(d){
  /* Charges with no split yet, nearest in amount first. */
  const want=d.total!==null?d.total:sum(d.items.map(i=>i.cents))+d.tax;
  return S.txs.filter(t=>t.cents>0&&!t.split&&t.status!=='transfer').sort((a,b)=>Math.abs(a.cents-want)-Math.abs(b.cents-want)||byDate(a,b));
}
function rcMatch(d){
  const sums=[d.total,sum(d.items.map(i=>i.cents))+d.tax].filter(x=>x!==null&&x>0);
  const dd2=(a,b)=>Math.abs((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/864e5);
  let c=S.txs.filter(t=>t.cents>0&&!t.split&&t.status!=='transfer'&&sums.includes(t.cents)&&(!d.date||dd2(t.date,d.date)<=7));
  if(c.length>1){
    const w=d.store.toUpperCase().replace(/[^A-Z ]/g,' ').split(/\s+/).filter(x=>x.length>=3);
    const sc=c.filter(t=>w.some(x=>t.desc.toUpperCase().includes(x)));if(sc.length)c=sc;
  }
  if(c.length>1){const rv=c.filter(t=>t.status==='review');if(rv.length)c=rv}
  return c;
}
/* Save the split without asking, but only when the items and tax add up to the charge to the cent. */
function rcApply(r,t){
  const lines=rcLines(r.data,fallbackCat(t)),tax=r.data.tax;
  const T=totals(lines,tax,t.cents);
  if(!lines.length||T.diff!==0)return false;
  t.split={lines:lines.map(({name,cents,cat,taxable,manual,remainder})=>({name,cents,cat,taxable,manual,remainder})),tax};
  t.allocations=rollup(priceLines(lines,tax));t.status='done';t.manual=true;
  r.tid=t.id;r.state='filed';return true;
}
async function rcRun(files){
  if(!scanAI)return;
  const batch=files.map(f=>({id:++rcSeq,name:f.name||'Receipt photo',state:'queued',file:f}));
  rcs=[...batch,...rcs];render();
  if(rcBusy)return;
  rcBusy=true;rcCtl=new AbortController();
  let r;
  while((r=rcs.find(x=>x.state==='queued'))){
    r.state='reading';render();
    try{
      const raw=await scanAI.json(scanPrompt(null),{images:[r.file],signal:rcCtl.signal});
      const d=rcNormalize(raw);delete r.file;
      if(!d.items.length){r.state='err';r.err='No items could be read from this photo. Try a clearer, flatter shot with the whole receipt in view.';continue}
      r.data=d;
      const m=rcMatch(d);
      if(m.length===1&&rcApply(r,m[0])){save()}
      else if(m.length>1){r.state='pick';r.options=m.map(t=>t.id)}
      else if(rcAddNew(r)){save()}
      else{r.state='pick';r.options=rcCandidates(d).slice(0,40).map(t=>t.id)}
    }catch(e){
      delete r.file;
      if(e&&e.code==='cancelled'){r.state='err';r.err='Stopped.';rcs.filter(x=>x.state==='queued').forEach(x=>{x.state='err';x.err='Skipped.';delete x.file});break}
      r.state='err';r.err=SCAN_ERR[e&&e.code]||SCAN_ERR.upstream_error;
      if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'||e.code==='rate_limited'||e.code==='session_expired')){rcs.filter(x=>x.state==='queued').forEach(x=>{x.state='err';x.err='Skipped.';delete x.file});break}
    }finally{render()}
  }
  rcBusy=false;rcCtl=null;render();
}
/* Add the receipt as a charge of its own. A later bank import matches it by amount and date instead of duplicating it. */
function rcAddNew(r){
  const d=r.data,lines=rcLines(d,neutralCat());
  if(!lines.length)return false;
  const T=totals(lines,d.tax,0),cents=T.total;
  if(!(cents>0))return false;
  const t={id:++S.seq,date:d.date||todayISO,desc:d.store||'Receipt',cents,manual:true,entered:true,status:'done',split:{lines:lines.map(({name,cents,cat,taxable,manual,remainder})=>({name,cents,cat,taxable,manual,remainder})),tax:d.tax}};
  t.allocations=rollup(priceLines(lines,d.tax));
  S.txs.push(t);r.tid=t.id;r.state='added';r.created=true;
  r.note=(d.total!==null&&d.total!==cents)?`The receipt says ${fmt(d.total)} but the items and tax add up to ${fmt(cents)}, so I used ${fmt(cents)}. Open it to check.`:'';
  curMonth=t.date.slice(0,7);
  return true;
}
function rcOpen(r,tid,withLines){
  const t=find(tid);if(!t)return;
  pend={id:tid,lines:withLines?{lines:rcLines(r.data,fallbackCat(t)),tax:r.data.tax}:null};
  curMonth=t.date.slice(0,7);qText='';
  location.hash='#activity';
}
function rcUndo(r){
  const t=find(r.tid);if(!t)return;
  if(r.created){S.txs=S.txs.filter(x=>x.id!==t.id);r.state='undone';r.created=false;commit();toast('Removed. The receipt was not added.');return}
  Object.assign(t,{split:null,manual:false,allocations:[],status:'review'});
  reeval();r.state='undone';commit();toast('Split removed. The charge is back to how it was before the photo.');
}

    if(r.state==='filed'){const t=find(r.tid);if(!t)return '';

    const opts=r.options.map(tid=>find(tid)).filter(Boolean).map(t=>`<option value="${t.id}">${fd(t.date)} · ${esc(t.desc.slice(0,28))} · ${fmt(t.cents)}</option>`).join('');
    return `<div class="rc">${head}<div class="status warn"><span>Read ${what}. ${rcMatch(d).length>1?'More than one charge fits.':'No bank charge has exactly this total.'} Choose the charge it belongs to, or add it as a new one.</span></div><div class="actions" style="margin-top:6px"><select id="rcsel-${r.id}" aria-label="Charge for ${esc(r.name)}">${opts}</select><button class="btn small primary" type="button" data-act="rcuse" data-id="${r.id}">Use this charge</button><button class="btn small" type="button" data-act="rcnew" data-id="${r.id}">Add as a new charge instead</button></div></div>`;
  }).join('');
  return `<section class="card" style="margin-bottom:16px"><h3>Receipt photos</h3><p class="meta" style="margin:4px 0 10px">Pick one or more receipt photos from your photo library. Claude reads each one and adds it as a new charge with the items already split. If your bank file already has that charge, it is matched to it instead. Importing your bank file later checks every receipt against it. Photos are sent to Claude to read and are not stored.</p><div class="actions"><label class="btn primary" for="rcimgs">Choose receipt photos</label><input type="file" id="rcimgs" class="vh" multiple accept="${scanAccept}" aria-label="Receipt photos">${rcBusy?'<button class="btn small" type="button" data-act="rcstop">Stop</button>':''}</div>${rows?`<div class="rcs" style="margin-top:10px">${rows}</div>`:''}</section>`;

function addLine(){
  const a=draft.add||{},name=(a.name||'').trim(),cents=parseMoney(a.amt||'');
  if(!name){toast('Give the item a name.');return}
  if(!(cents>0)){toast('Enter the item price as a dollar amount, like 4.99.');return}
  const t=find(openId),cat=a.cat||fallbackCat(t);
  draft.lines.push({id:++uid,name,cents,cat,taxable:a.taxable!==false&&cat!=='Grocery'?true:a.taxable===true,tag:'',manual:true});
  draft.add={cat:a.cat,taxable:a.taxable};render();
}
function addRemainder(){
  const t=find(openId),T=totals(draft.lines,draft.tax,t.cents);
  if(T.diff<=0)return;
  draft.lines.push({id:++uid,name:'Unitemized remainder',cents:T.diff,cat:$('#rem-cat').value,taxable:false,tag:'',manual:true,remainder:true});
  render();
}
function saveSplit(){
  const t=find(openId);if(!t||!draft)return;
  const snap=snapshot();
  const T=totals(draft.lines,draft.tax,t.cents);
  if(T.diff!==0||!draft.lines.length)return;
  const priced=priceLines(draft.lines,draft.tax);
  t.split={lines:draft.lines.map(({name,cents,cat,taxable,manual,remainder})=>({name,cents,cat,taxable,manual,remainder})),tax:draft.tax};
  t.allocations=rollup(priced);t.status='done';t.manual=true;
  if(draft.remember)draft.lines.forEach(l=>{if(!l.remainder)S.learned[nk(l.name)]=l.cat});
  let extra='';
  if(draft.askNext&&!matchRule(t.desc,S.rules)){
    const top=t.allocations.slice().sort((a,b)=>b.cents-a.cents)[0];
    const p=merchantKey(t.desc);
    if(p&&top){S.rules.push({id:++S.seq,pattern:p,mode:'ask',cat:top.cat});extra=` Future ${p} charges over ${fmt(S.cfg.threshold)} will ask for a receipt.`}
  }
  const n=t.allocations.length;
  closeEditor();commit();
  toast(`Split saved across ${n} categor${n===1?'y':'ies'}. The ${fmt(t.cents)} is counted once.${extra}`,snap);
}
function assign(id,cat){
  const snap=snapshot();
  const t=find(id),remEl=$('#rem-'+id),patEl=$('#pat-'+id);
  Object.assign(t,{allocations:[{cat,cents:t.cents}],status:'done',manual:true,split:null});
  let msg=`${t.desc} ${fmt(t.cents)} assigned to ${cat}.`;
  if(remEl&&remEl.checked&&patEl){
    const p=normKey(patEl.value);
    if(p&&!S.rules.some(r=>r.pattern===p)){
      S.rules.push({id:++S.seq,pattern:p,mode:'cat',cat});
      const before=reviewCount();reeval();
      const handled=Math.max(0,before-reviewCount());
      msg+=` Remembered ${p}.`+(handled>0?` ${handled} other charge${handled===1?'':'s'} matched it.`:'');
    }
  }
  closeEditor();commit();toast(msg,snap);
}

  if(!S.txs.length)return `<div class="empty"><p style="margin:0 0 6px"><strong>No charges yet.</strong></p><p style="margin:0 0 4px">Download a CSV of your recent transactions from your bank's website, then import it here. The file is read in this browser.</p><div class="actions"><button class="btn primary" type="button" data-act="goto-import">Import a CSV</button><button class="btn" type="button" data-act="goto-add">Add one by hand</button><button class="btn" type="button" data-act="sample-data">Try with sample data</button></div></div>`;
  const guesses=S.txs.filter(t=>t.status==='guess').sort(byDate);

    ?`<p class="lede"><strong>${items.length} purchase${items.length===1?'':'s'} need${items.length===1?'s':''} a decision.</strong> They count toward total spending but stay out of every budget until you split or assign them, so your category budgets are never understated.</p>`

  const mHTML=mixed.length>=2?`<section class="panel"><h3>Skip the receipts?</h3><p>${mixed.length} purchases are from mixed-category stores (${fmt(sum(mixed.map(t=>t.cents)))} in total). Splitting them is optional. You can file them all under each store's default category now and still split any later.</p><button class="btn" type="button" data-act="defaultall">File ${mixed.length} under default categories</button></section>`:'';
  const dOpts=sel=>`<option value="">Choose where it goes…</option>`+S.cats.map(c=>`<option value="${esc(c)}"${sel===c?' selected':''}>${esc(c)}</option>`).join('')+`<option value="${DISP}"${sel===DISP?' selected':''}>${DISP}</option>`;
  const splitHTML=t=>{const tot=-t.cents,rs=dsplit.rows,used=sum(rs.map(r=>{const c=parseMoney(r.amt);return Number.isNaN(c)?0:c})),left=tot-used;
    return `<div class="panel" style="margin:8px 0"><div class="meta">Split ${fmt(tot)} from ${esc(niceName(t.desc))}. Each part can go back to a category it paid back, or count as disposable income.</div>${rs.map((r,i)=>`<div class="incrow" style="flex-wrap:wrap;border-top:0"><select data-dsc="${i}" aria-label="Where part ${i+1} goes">${dOpts(r.cat)}</select><span>$<input type="number" min="0" step="0.01" data-dsa="${i}" value="${esc(r.amt)}" placeholder="0.00" style="width:100px" aria-label="Amount for part ${i+1}"> <button class="btn small ghost" type="button" data-act="dsrm" data-i="${i}" aria-label="Remove part ${i+1}">×</button></span></div>`).join('')}<div class="meta" style="margin:6px 0">${left===0?'Fully placed.':(left>0?fmt(left)+' left to place.':fmt(-left)+' too much.')}</div><div class="actions"><button class="btn small" type="button" data-act="dsadd">Add a part</button><button class="btn small" type="button" data-act="dsrest">Rest to disposable income</button><button class="btn small primary" type="button" data-act="dssave">Save split</button><button class="btn small ghost" type="button" data-act="dscancel">Cancel</button></div></div>`};
  const pinRow=t=>`<div class="incrow" style="flex-wrap:wrap"><span>${fd(t.date)} · ${esc(niceName(t.desc))} · <b>${fmt(-t.cents)}</b></span><span>${dsplit&&dsplit.id===t.id?'':`<select id="dq-${t.id}" aria-label="Where this money goes">${dOpts('')}</select> <button class="btn small primary" type="button" data-act="depassign" data-id="${t.id}">Assign all</button> <button class="btn small" type="button" data-act="depsplit" data-id="${t.id}">Split</button> <button class="btn small ghost" type="button" data-act="ignoredep" data-id="${t.id}">Not income</button>`}</span></div>${dsplit&&dsplit.id===t.id?splitHTML(t):''}`;
  const pHTML=pin.length?`<section class="card" style="margin-bottom:16px"><h3>Money in to sort (${pin.length})</h3><p class="meta" style="margin:4px 0 8px">Venmo, Cash App and Zelle can be a payback or a payment. Pick where the money goes. A category means it paid you back for something in that budget. <b>Disposable income</b> adds to your total income without needing to be assigned. Venmo often pays out many things at once, so use <b>Split</b> to divide one deposit.</p>${pin.map(pinRow).join('')}${dispAsk&&dispAsk.m?dispFormHTML(dispAsk.m,true):''}</section>`:'';
  const cards=items.length?`<div class="stack">${items.map(cardHTML).join('')}</div>`:(guesses.length||pin.length?'':`<div class="empty">All caught up.</div>`);
  return lede+pHTML+gHTML+mHTML+cards;
}

/* ---------- charts ---------- */
const compactMoney=c=>{const d=Math.abs(c)/100;return '$'+(d>=1000?(d/1000).toFixed(d>=10000?0:1).replace(/\.0$/,'')+'k':Math.round(d))};
function monthChart(budget){
  const dim=daysIn(curMonth),isCur=curMonth===todayKey,dayNow=isCur?today.getDate():dim;
  const txs=S.txs.filter(t=>t.date.startsWith(curMonth)&&t.status!=='transfer'&&t.status!=='credit');
  if(!txs.length)return `<div class="empty">Nothing to chart for ${monthLabel(curMonth)} yet.</div>`;
  const byDay=new Array(dim+1).fill(0);txs.forEach(t=>{byDay[+t.date.slice(8,10)]+=t.cents-savedPart(t)});
  let lastData=0;for(let d=1;d<=dim;d++)if(byDay[d])lastData=d;
  const last=isCur?Math.max(dayNow,lastData):dim;
  const cum=[0];for(let d=1;d<=dim;d++)cum[d]=cum[d-1]+byDay[d];
  const total=cum[last],over=budget>0&&total>budget+OVER_SLACK;
  const narrow=window.innerWidth<=680,W=narrow?370:520,H=230,pl=narrow?42:48,pr=narrow?88:100,pt=14,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const ymax=Math.max(budget,total,1)*1.1;
  const X=d=>pl+(dim>1?(d-1)/(dim-1):0)*iw,Y=v=>pt+(1-Math.max(v,0)/ymax)*ih;
  const col=over?'var(--bad)':'var(--ok)';
  let g='';
  [0,.25,.5,.75,1].forEach(f=>{const v=ymax*f/1.1;g+=`<line x1="${pl}" x2="${pl+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${compactMoney(v)}</text>`});
  (narrow?[1,15,dim]:[1,8,15,22,dim]).forEach(d=>{g+=`<text x="${X(d)}" y="${H-8}" text-anchor="middle">${monthShort(curMonth)} ${d}</text>`});
  let line='';for(let d=1;d<=last;d++)line+=(d>1?' ':'')+X(d).toFixed(1)+','+Y(cum[d]).toFixed(1);
  const yb=Y(budget),ys=Y(total);
  const spentLblY=Math.abs(ys-yb)<15?(ys<yb?ys-6:ys+14):ys+4;
  const pace=isCur&&budget>0?`<line x1="${X(1)}" y1="${Y(0)}" x2="${X(dim)}" y2="${Y(budget)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 4"/>`:'';
  lcData={dim,last,cum,budget,isCur,W,pl,iw,month:curMonth,over};
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative spending in ${monthLabel(curMonth)}: ${fmt(total)} so far against a ${fmt(budget)} budget, ${over?'over':'within'} budget.">${g}
    <line x1="${pl}" x2="${pl+iw}" y1="${yb}" y2="${yb}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 4"/>${pace}
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last)}" cy="${ys}" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl+iw+8}" y="${spentLblY}" class="ink">${over?'▲':'✓'} Spent ${compactMoney(total)}</text>
    <text x="${pl+iw+8}" y="${yb+(Math.abs(ys-yb)<15&&ys<yb?14:4)}">Budget ${compactMoney(budget)}</text>
    <line id="lcx" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" stroke="var(--ink)" stroke-width="1" opacity="0"/>
  </svg>`;
  const legend=`<div class="legend" style="margin-top:6px"><span><i style="background:${col}"></i>Spent so far</span><span><i style="background:var(--muted);height:2px;vertical-align:3px"></i>Total budget</span>${isCur&&budget>0?'<span><i style="background:var(--muted);height:2px;vertical-align:3px;opacity:.6"></i>Even pace</span>':''}</div>`;
  let tbl='<table class="tbl"><thead><tr><th>Day</th><th class="r">That day</th><th class="r">Running total</th></tr></thead><tbody>';
  for(let d=1;d<=last;d++)if(byDay[d])tbl+=`<tr><td>${monthShort(curMonth)} ${d}</td><td class="r mono">${fmt(byDay[d])}</td><td class="r mono">${fmt(cum[d])}</td></tr>`;
  tbl+='</tbody></table>';
  return `<div class="lcwrap">${showTbl?`<div class="scroll">${tbl}</div>`:svg+'<div class="lctip" id="lctip"></div>'}</div>${showTbl?'':legend}
   <div class="actions" style="margin-top:8px"><button class="btn small ghost" type="button" data-act="tbl">${showTbl?'Show chart':'View as table'}</button></div>`;
}
function composeHTML(st){
  const items=S.cats.filter(c=>groupOf(c)!=='Savings').map(c=>({c,v:st.spent[c]||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const tot=sum(items.map(x=>x.v)),mx=Math.max(...items.map(x=>x.v),1);
  let h=`<h3>Where the money went</h3>`;
  if(!items.length&&!st.unalloc)return h+`<div class="empty" style="margin-top:10px">No spending in ${monthLabel(curMonth)} yet.</div>`;
  h+=`<div style="margin-top:8px">`+items.map(x=>`<div class="crow" title="${esc(x.c)}: ${fmt(x.v)}, ${Math.round(x.v/tot*100)}% of categorized spending"><span class="cn">${esc(x.c)}</span><div class="ctrack" aria-hidden="true"><i style="width:${x.v/mx*100}%"></i></div><span class="mono cv">${fmt(x.v)}</span><span class="cp">${Math.round(x.v/tot*100)}%</span></div>`).join('');
  if(st.unalloc>0)h+=`<div class="crow" title="Needs review: ${fmt(st.unalloc)}"><span class="cn">Needs review</span><div class="ctrack" aria-hidden="true"><i class="hatch" style="width:${Math.min(st.unalloc/mx,1)*100}%"></i></div><span class="mono cv">${fmt(st.unalloc)}</span><span class="cp"></span></div>`;
  h+=`</div>`;
  const pl={};S.txs.filter(t=>t.date.startsWith(curMonth)&&t.cents>0&&t.status!=='transfer'&&t.status!=='credit'&&t.cents-savedPart(t)>0).forEach(t=>{const n=niceName(t.desc);(pl[n]=pl[n]||{n,c:0,v:0});pl[n].c++;pl[n].v+=t.cents-savedPart(t)});
  const top=Object.values(pl).sort((a,b)=>b.v-a.v).slice(0,5);
  if(top.length)h+=`<div class="sub">Top places</div>`+top.map(x=>`<div class="place"><span>${esc(x.n)} <span class="meta">${x.c} charge${x.c===1?'':'s'}</span></span><span class="mono">${fmt(x.v)}</span></div>`).join('');
  return h;
}
function trendsHTML(){
  const ms=months(),i=ms.indexOf(curMonth);
  if(ms.length<2||i<0)return '';
  const span=ms.slice(Math.max(0,i-5),i+1);
  if(span.length<2)return '';
  const sts=span.map(m=>stats(m));
  const cards=S.cats.map(c=>{
    const v=sts.map(x=>x.spent[c]||0);
    if(!v.some(x=>x>0))return '';
    const mx=Math.max(...v,1),w=120,h=34,pts=v.map((y,k)=>[4+k/(v.length-1)*(w-8),h-4-(y/mx)*(h-8)]);
    const cur=v[v.length-1],prv=v[v.length-2],d=cur-prv;
    return `<div class="trend" title="${esc(c)}: ${v.map((y,k)=>monthShort(span[k])+' '+fmt(y)).join(', ')}"><b>${esc(c)}</b><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(c)} by month"><polyline points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--neutral)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/></svg><div class="meta"><span class="mono">${fmt(cur)}</span> ${d===0?'same as':(d>0?'▲ '+fmt(d)+' vs':'▼ '+fmt(-d)+' vs')} ${monthShort(span[span.length-2])}</div></div>`;
  }).join('');
  return cards?`<section class="card" style="margin-bottom:16px"><h3>Trends, last ${span.length} months</h3><div class="trends">${cards}</div></section>`:'';
}
function goalsCard(){
  const tk=S.track||{},goals=S.cats.filter(c=>tk[c]&&tk[c].goal),funds=S.cats.filter(c=>tk[c]&&tk[c].roll);
  const bar=(pct,label)=>`<div class="track" role="img" aria-label="${esc(label)}"><div class="bg"><div class="fill" style="width:${pct}%"></div></div></div>`;
  const gHTML=goals.map(c=>{
    const g=goalInfo(c,curMonth);
    const line1=g.done?'✓ Goal reached.':`${fmt(g.left)} to go by the end of ${monthLabel(g.by)}.`;
    const mline=`This month: ${fmt(g.contrib)} of ${fmt(g.plan)} saved${g.monthLeft>0?', '+fmt(g.monthLeft)+' left to save':' ✓'}.`;
    let pace='';
    if(!g.done){
      if(g.monthsLeft>0)pace=`To finish on time you need about ${fmt(g.need)} a month${g.plan?(g.plan>=g.need?' (your plan covers it).':` (your plan is ${fmt(g.plan)}).`):'.'}`;
      else pace='The deadline has passed.';
      if(g.moreMonths)pace+=` At ${fmt(g.plan)} a month that is about ${g.moreMonths} more month${g.moreMonths===1?'':'s'}.`;
    }
    return `<div class="gblock"><div class="ghead2"><b>${esc(c)}</b><span class="mono">${fmt(g.saved)} of ${fmt(g.target)}</span></div>${bar(g.pct,`${c}: ${fmt(g.saved)} of ${fmt(g.target)}`)}<p class="meta" style="margin:6px 0 0">${line1} ${mline} ${pace}</p>${goalEdit===c?goalFormHTML(c,(S.track||{})[c]||{}):`<div class="actions" style="margin-top:8px"><button class="btn small" type="button" data-act="goaledit" data-name="${esc(c)}">Edit goal</button><button class="btn small ghost" type="button" data-act="goalrm" data-name="${esc(c)}">Remove goal</button></div>`}</div>`;
  }).join('');
  let totalAvail=0;
  const fHTML=funds.map(c=>{
    const r=rollInfo(c,curMonth);if(!r)return '';
    totalAvail+=r.left;
    const nextPlan=planFor(ymAdd(curMonth,1)).budgets[c]||0;
    const pct=r.avail>0?Math.min(Math.max(r.spent,0)/r.avail,1)*100:0;
    const carryTxt=r.carry>0?` + ${fmt(r.carry)} saved up`:(r.carry<0?` − ${fmt(-r.carry)} from last month`:'');
    return `<div class="gblock"><div class="ghead2"><b>${esc(c)}</b><span class="mono big">${fmt(r.left)} available</span></div>${bar(pct,`${c}: ${fmt(r.spent)} spent of ${fmt(r.avail)}`)}<p class="meta" style="margin:6px 0 0">${fmt(r.plan)} this month${carryTxt}, ${fmt(r.spent)} spent so far. Spend it now, or leave it: if you spend nothing more, ${monthLabel(ymAdd(curMonth,1))} starts with ${fmt(r.left+nextPlan)}.</p>${rollBaseHTML(c,(S.track||{})[c]||{})}</div>`;
  }).join('');
  const tot=funds.length>1?`<div class="ghead2 gblock"><b>All saved-up money</b><span class="mono big">${fmt(totalAvail)} available</span></div>`:'';
  const hint=(!goals.length&&!funds.length)?`<p class="meta" style="margin:4px 0 0">Tap a category's name below to set a savings goal for it, or to let what you don't spend carry into next month.</p>`:'';
  return `<section class="card" style="margin-bottom:16px"><h3>Goals and saved-up money</h3>${gHTML}${fHTML}${tot}${hint}</section>`;
}
function viewBudgets(){
  const st=stats(),plan=planFor(curMonth),B=plan.budgets,budgeted=plannedSpend(curMonth),isCur=curMonth===todayKey;
  const dim=daysIn(curMonth),dayNow=isCur?today.getDate():dim,daysLeft=Math.max(dim-dayNow+1,1);
  const ms=months(),pi=ms.indexOf(curMonth),prev=pi>0?ms[pi-1]:null,pst=prev?stats(prev):null;
  const over=budgeted>0&&st.inBudgets>budgeted+OVER_SLACK,denom=Math.max(budgeted,st.total,1);
  const info=S.cats.map(c=>{const spent=st.spent[c]||0,pend=st.pendBy[c]||0,lim=B[c]||0,rb=rollInfo(c,curMonth),carry=rb?rb.carry:0;return {c,spent,pend,lim,carry,pct:lim?spent/lim:(spent>0?9:0)}});
  const byCat={};info.forEach(r=>{byCat[r.c]=r});
  const brow=r=>{
    const {c,spent,pend,lim,carry}=r,cap=lim+carry,sav=groupOf(c)==='Savings',isOver=!sav&&spent>cap+OVER_SLACK,left=Math.max(cap-spent,0);
    const a=cap>0?Math.min(Math.max(spent,0)/cap,1)*100:(spent>0?100:0);
    const b=cap>0?Math.min(pend/cap,1-a/100)*100:0;
    const chip=isOver?`<span class="chipstat bad">▲ Over by ${fmt(spent-cap)}</span>`:(spent>0?`<span class="chipstat good">✓ On track</span>`:'');
    const tick=(isCur&&lim>0)?`<i class="pace" style="left:${dayNow/dim*100}%" title="Where an even pace would be today"></i>`:'';
    const proj=isCur&&!isOver&&dayNow>=5&&spent>0&&spent/dayNow*dim>lim&&!NO_PACE.has(groupOf(c));   // fixed bills are paid in one go, so a pace warning means nothing
    const perDay=(isCur&&!isOver&&left>0)?` · about ${fmt(Math.round(left/daysLeft))} a day`:'';
    const dl=(!isCur&&pst&&(spent||pst.spent[c]))?(()=>{const d=spent-(pst.spent[c]||0);return `<span>${d===0?'Same as':(d>0?'▲ '+fmt(d)+' vs':'▼ '+fmt(-d)+' vs')} ${monthShort(prev)}</span>`})():'';
    const limCtl=editB===c?`$<input type="number" min="0" step="10" id="bedit" data-budget="${esc(c)}" value="${lim/100}" aria-label="${esc(c)} budget in dollars">`:`<button class="lim" type="button" data-act="editbudget" data-name="${esc(c)}" aria-label="Edit ${esc(c)} budget, now ${fmt(lim)}">${fmt(lim)}</button>`;
    return `<div class="brow"><div class="bname">${nameBtn(c)}${chip}</div><div class="track" role="img" aria-label="${esc(c)}: ${fmt(spent)} of ${fmt(lim)}${pend?', plus '+fmt(pend)+' waiting for review':''}"><div class="bg"><div class="fill${isOver?' over':''}" style="width:${a}%"></div><div class="pend" style="width:${b}%"></div></div>${tick}</div>
     <div class="bnum"><span class="line1"><span class="mono">${fmt(spent)}</span> of ${limCtl}${carry?` <span class="meta">${carry>0?'+ '+fmt(carry)+' saved up':'− '+fmt(-carry)+' from last month'}</span>`:''}</span>
     <span class="${isOver?'left-over':''}">${isOver?fmt(spent-cap)+' over':(sav?(left>0?fmt(left)+' left to save':(spent>cap+OVER_SLACK?fmt(spent-cap)+' extra saved':'✓ Done for this month')):fmt(left)+' left')}${perDay}</span>${proj?'<span class="left-over">▲ On pace to run over</span>':''}${pend?`<span>${fmt(pend)} more waiting for review</span>`:''}${dl}</div></div>`;
  };
  const nameBtn=c=>`<button class="catbtn" type="button" data-act="togcat" data-name="${esc(c)}" aria-expanded="${openCats.has(c)}" title="Show what is in ${esc(c)}"><span class="chev">${openCats.has(c)?'▾':'▸'}</span>${esc(c)}</button>`;
  const catList=c=>{
    if(!openCats.has(c))return '';
    const tr=(S.track||{})[c]||{};
    const gf=(goalEdit===c&&!tr.goal)?goalFormHTML(c,tr)
      :`<div class="actions">${tr.goal?`<span class="meta">Goal: ${fmt(tr.goal.target)} by ${monthLabel(tr.goal.by)}</span><button class="btn small" type="button" data-act="goaledit" data-name="${esc(c)}">Edit goal</button><button class="btn small ghost" type="button" data-act="goalrm" data-name="${esc(c)}">Remove goal</button>`:`<button class="btn small" type="button" data-act="goaledit" data-name="${esc(c)}">Set a savings goal</button>`}</div>`;
    const cset=`<div class="cset"><label class="field"><input type="checkbox" data-roll="${esc(c)}"${tr.roll?' checked':''}> Save up what I don't spend (it carries into next month)</label>${tr.roll?rollBaseHTML(c,tr):''}${gf}</div>`;
    const es=[];
    S.txs.forEach(t=>{
      if(!t.date.startsWith(curMonth)||t.status==='transfer'||t.status==='credit')return;
      if(t.status==='review'){if(fallbackCat(t)===c)es.push({t,cents:t.cents,pending:true});return}
      (t.allocations||[]).forEach(a=>{if(a.cat===c)es.push({t,cents:a.cents,part:(t.allocations.length>1)})});
    });
    es.sort((x,y)=>y.t.date.localeCompare(x.t.date)||y.t.id-x.t.id);
    if(!es.length)return `<div class="catlist">${cset}<p class="meta" style="margin:2px 0">Nothing in ${esc(c)} for ${monthLabel(curMonth)} yet.</p></div>`;
    return `<div class="catlist">${cset}${es.map(e=>`<div class="centry" role="listitem"><span class="cd">${fd(e.t.date)}</span><span class="cn">${esc(niceName(e.t.desc))}${e.part?`<em> · part of ${fmt(e.t.cents)}</em>`:''}${e.pending?'<em> · waiting for review</em>':''}${e.t.entered?'<em> · added by hand</em>':''}</span><span class="mono ca">${fmt(e.cents)}</span></div>`).join('')}</div>`;
  };
  const crow=r=>{

function allocText(t){
  if(t.status==='transfer')return 'Moved between your own accounts, so it is not counted as spending.';
  if(t.status==='credit')return t.extra?'Disposable income. Counted toward what you can budget.':'Money in. Not counted as spending.';
  if(t.status==='review')return 'Held out of budgets until reviewed.';
  return t.allocations.map(a=>`${esc(a.cat)} ${fmt(a.cents)}`).join(' · ');
}
function pillOf(t){
  if(t.status==='transfer')return ['Transfer',''];
  if(t.status==='credit')return [t.extra?'Disposable income':'Money in',t.extra?'ok':''];
  if(t.status==='review')return ['Needs review','warn'];
  if(t.status==='guess')return ['Guessed','accent'];
  if(t.split)return ['Split','accent'];
  if(t.manual)return ['Assigned',''];
  return ['Auto',''];
}
function actList(){
  const q=qText.trim().toUpperCase();
  let list=S.txs.filter(t=>t.date.startsWith(curMonth)&&(!q||t.desc.toUpperCase().includes(q)||niceName(t.desc).toUpperCase().includes(q))).sort(byDate);
  if(actFilter==='review')list=list.filter(t=>t.status==='review'||t.status==='guess');
  else if(actFilter!=='all')list=list.filter(t=>(t.allocations||[]).some(a=>a.cat===actFilter));
  if(!list.length)return `<div class="empty">${S.txs.length?'No charges match.':'Nothing imported yet.'}</div>`;
  return list.map(t=>{
    const [pl,pc]=pillOf(t);
    let cat;
    if(t.status==='transfer'&&t.cents>0)cat=`<span class="pill ${pc}">${pl}</span><select data-actcat="${t.id}" aria-label="Count ${esc(niceName(t.desc))} as savings"><option value="">Count as savings in…</option>${S.cats.filter(c=>groupOf(c)==='Savings'||((S.track||{})[c]&&S.track[c].goal)).map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;
    else if(t.status==='transfer'||t.status==='credit')cat=`<span class="pill ${pc}">${pl}</span>`;
    else if(t.status==='review')cat=`<span class="pill warn">Needs review</span><select data-actcat="${t.id}" aria-label="Choose a category for ${esc(niceName(t.desc))}"><option value="">Choose category</option>${catOpts('')}</select>`;
    else if(t.split||(t.allocations||[]).length!==1)cat=`<span class="pill accent">Split</span><span class="chips">${t.allocations.map(a=>`<span class="chip">${esc(a.cat)} ${fmt(a.cents)}</span>`).join('')}</span>`;
    else cat=`<select data-actcat="${t.id}" aria-label="Category for ${esc(niceName(t.desc))}">${catOpts(t.allocations[0].cat)}</select>${t.status==='guess'?'<span class="pill accent">Guessed</span>':''}`;
    const items=[];
    if(t.cents>0&&t.status!=='transfer'&&openId!==t.id)items.push(`<button class="btn small" type="button" data-act="open" data-id="${t.id}">${t.split?'Edit split':'Split with a receipt'}</button>`);

    else if(t.status!=='credit'&&t.status!=='review')items.push(`<button class="btn small" type="button" data-act="transfer" data-id="${t.id}">Mark as transfer</button>`);
    if(t.status==='credit'){items.push(`<button class="btn small" type="button" data-act="refund" data-id="${t.id}">Count as a refund</button>`);if(t.cents<0)items.push(t.extra?`<button class="btn small" type="button" data-act="unextra" data-id="${t.id}">Not disposable income</button>`:`<button class="btn small" type="button" data-act="extrainc" data-id="${t.id}">Disposable income</button>`)}
    items.push(delId===t.id?`<button class="btn small danger on" type="button" data-act="del" data-id="${t.id}">Confirm remove</button>`:`<button class="btn small danger" type="button" data-act="del" data-id="${t.id}">Remove</button>`);
    const note=t.status==='transfer'?'Moved between your own accounts, so it is not counted as spending.':(t.status==='credit'?'Money in. Not counted as spending.':'');
    return `<div class="arow"><span class="d">${fd(t.date)}</span><div class="who"><b title="${esc(t.desc)}">${esc(niceName(t.desc))}</b><div class="raw" title="${esc(t.desc)}">${esc(t.desc)}</div>${note&&t.status==='transfer'?`<div style="font-size:12.5px">${note}</div>`:''}<div class="catline">${cat}</div></div><span class="amt${t.cents<0?' neg':''}" style="font-size:15px">${fmt(t.cents)}</span><button class="btn small ghost more" type="button" data-act="menu" data-id="${t.id}" aria-expanded="${menuId===t.id}" aria-label="More actions for ${esc(niceName(t.desc))}">⋯</button></div>${menuId===t.id?`<div class="rowmenu">${items.join('')}</div>`:''}${openId===t.id?`<div class="edwrap">${editorHTML(t)}</div>`:''}`;
  }).join('');
}
function addManual(){
  const f=addF,desc=f.desc.trim(),cents=parseMoney(f.amt);
  if(!desc){toast('Enter where the money went, like Chick-fil-A.');return}
  if(!(cents>0)){toast('Enter an amount like 12.50.');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)){toast('Pick the date.');return}
  const snap=snapshot();
  const out=f.type!=='in',c=out?cents:-cents;
  const t={id:++S.seq,date:f.date,desc,cents:c,manual:false,entered:true};
  if(f.cat&&S.cats.includes(f.cat))Object.assign(t,{allocations:[{cat:f.cat,cents:c}],status:'done',manual:true,split:null});
  else Object.assign(t,evaluateTx(t,S));
  S.txs.push(t);
  curMonth=f.date.slice(0,7);actFilter='all';qText='';
  addF={date:f.date,desc:'',amt:'',type:f.type,cat:''};
  const where=niceName(desc);
  const how=t.status==='review'?'It needs a category, so it is waiting in Review.':(t.status==='guess'?`Guessed ${t.allocations[0].cat}. Confirm it in Review.`:(t.status==='credit'?'Counted as money in, not spending.':`Filed under ${t.allocations.map(a=>a.cat).join(', ')}.`));
  commit();toast(`Added ${fmt(Math.abs(c))} ${out?'at':'from'} ${where}. ${how}`,snap);
  const d=$('#af-desc');if(d)d.focus();
}

  const nReview=mm.filter(t=>t.status==='review'||t.status==='guess').length;
  const cats=S.cats.filter(c=>mm.some(t=>(t.allocations||[]).some(a=>a.cat===c)));
  const chip=(f,l)=>`<button class="fchip" type="button" data-act="afilter" data-f="${esc(f)}" aria-pressed="${actFilter===f}">${esc(l)}</button>`;
  return addFormHTML()+`<div class="fchips" role="group" aria-label="Filter charges">${chip('all','All')}${nReview?chip('review','Needs a look ('+nReview+')'):''}${cats.map(c=>chip(c,c)).join('')}</div>

function mapSelect(key,label){
  const m=imp.map,head=m.hasHeader?(imp.rows[m.headerRow]||[]):[];
  const n=Math.max(...imp.rows.slice(0,50).map(r=>r.length));
  let o=`<option value="-1"${m[key]<0?' selected':''}>(none)</option>`;
  for(let i=0;i<n;i++){const name=(m.hasHeader&&head[i])?head[i]:`Column ${i+1}`;o+=`<option value="${i}"${m[key]===i?' selected':''}>${esc(name)}</option>`}
  return `<label>${label}<select data-map="${key}">${o}</select></label>`;
}
function effMap(){const m=imp.map;return imp.mode==='single'?{...m,debit:-1,credit:-1}:{...m,amount:-1}}
function viewImport(){
  let h=`<p class="lede">Import a CSV you downloaded from your bank or credit card. The file itself is read in this browser, then the charges are saved to your account. Importing the same file twice adds nothing new.</p>`+rcHTML();

     ${imp.mode==='single'?`<div class="radios"><label><input type="radio" name="sign" value="neg" data-sign${imp.negIsSpend?' checked':''}> Spending is negative (most bank accounts)</label><label><input type="radio" name="sign" value="pos" data-sign${imp.negIsSpend?'':' checked'}> Spending is positive (many credit cards)</label></div>`:''}
     <div class="scroll"><table class="prev"><thead><tr><th>Date</th><th>Description</th><th class="r">As Itemwise reads it</th></tr></thead><tbody>${prev||'<tr><td colspan="3">No readable rows yet. Check the columns above.</td></tr>'}</tbody></table></div>
     <p class="meta" style="margin:10px 0">${built.rows.length} readable rows: <strong>${dd.fresh.length} new</strong>, ${dd.skipped.length} already imported${built.bad.length?`, ${built.bad.length} skipped as unreadable`:''}.</p>
     <div class="actions"><button class="btn primary" type="button" data-act="doimport"${dd.fresh.length?'':' disabled'}>Import ${dd.fresh.length} charge${dd.fresh.length===1?'':'s'}</button><button class="btn" type="button" data-act="resetimp">Start over</button></div></section>`;
  }
  return h;

function readCsv(){
  const rows=parseCSV(imp.text||'');
  if(rows.length<1){toast('That file looks empty.');imp.rows=null;render();return}
  const map=guessMapping(rows);
  if(!map||map.date<0){toast('No date column was found. Pick one below.');}
  imp.rows=rows;imp.map=map||{hasHeader:true,headerRow:0,date:-1,desc:-1,amount:-1,debit:-1,credit:-1};
  imp.mode=imp.map.amount>=0||imp.map.debit<0?'single':'split';
  imp.negIsSpend=guessNegIsSpend(rows,imp.map);
  render();
}
function doImport(){
  const built=buildRows(imp.rows,effMap(),imp.negIsSpend),dd=dedupe(built.rows,S.txs.concat(S.dismissed||[]));
  /* A charge added by hand that shows up in the bank file is matched, not counted twice. */
  const dayDiff=(a,b)=>Math.abs((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/864e5);
  const mine=S.txs.filter(t=>t.entered),usedE=new Set();let matched=0;const fresh2=[];
  dd.fresh.forEach(r=>{
    const m=mine.find(t=>!usedE.has(t.id)&&t.cents===r.cents&&dayDiff(t.date,r.date)<=4);
    if(m){usedE.add(m.id);m.desc=r.desc;m.date=r.date;delete m.entered;if(!m.manual)Object.assign(m,evaluateTx(m,S));matched++}else fresh2.push(r);
  });
  const added=fresh2.map(r=>{const t={id:++S.seq,date:r.date,desc:r.desc,cents:r.cents,manual:false};Object.assign(t,evaluateTx(t,S));S.txs.push(t);return t});
  const cnt=s=>added.filter(t=>t.status===s).length;
  const latest=dd.fresh.map(r=>r.date.slice(0,7)).sort().pop();
  if(latest)curMonth=latest;
  imp=null;save();
  location.hash='#review';render();
  toast(`Imported ${added.length} charges: ${cnt('auto')+cnt('transfer')+cnt('credit')} filed automatically, ${cnt('guess')} guessed, ${cnt('review')} need your decision.${matched?` ${matched} matched a charge you added by hand.`:''}`);
}

/* ---------- accounts, net worth and dashboards ---------- */
const KINDS=[['checking','Checking','cash'],['savings','Savings','cash'],['cash','Cash on hand','cash'],['invest','Brokerage or investing','invest'],['retire','Retirement (IRA, 401k)','invest'],['crypto','Crypto','invest'],['property','Home or property','other'],['otherasset','Other asset','other'],['card','Credit card (amount owed)','debt'],['loan','Loan or mortgage (amount owed)','debt']];
const kindOf=k=>KINDS.find(x=>x[0]===k)||KINDS[0];
const acctClass=a=>kindOf(a.kind)[2];
const accts=()=>(S.accts=S.accts||[]);
function acctTotals(){
  const by=c=>sum(accts().filter(a=>acctClass(a)===c).map(a=>a.cents||0)),cash=by('cash'),inv=by('invest'),oth=by('other'),debt=by('debt');
  return {cash,inv,oth,debt,assets:cash+inv+oth,net:cash+inv+oth-debt};
}
/* One saved picture of your totals per day, so the net worth chart can show change over time. */
function recordSnap(){
  const T=acctTotals(),d=todayISO,snap={d,cash:T.cash,inv:T.inv,oth:T.oth,debt:T.debt};
  S.snaps=S.snaps||[];const i=S.snaps.findIndex(x=>x.d===d);if(i>=0)S.snaps[i]=snap;else S.snaps.push(snap);
  S.snaps.sort((a,b)=>a.d.localeCompare(b.d));if(S.snaps.length>800)S.snaps=S.snaps.slice(-800);
}
const moneyCell=x=>{let t=String(x==null?'':x).trim();if(!t)return NaN;const neg=/^\(.*\)$/.test(t)||/^-/.test(t);t=t.replace(/[()$,\s-]/g,'');const n=Number(t);return Number.isFinite(n)?Math.round(n*100)*(neg?-1:1):NaN};
function parseHoldings(text){
  const rows=parseCSV(text);if(!rows.length)return [];
  let hi=-1;for(let i=0;i<Math.min(rows.length,12);i++){if(rows[i].some(c=>/^(symbol|ticker)$/i.test(c.trim()))&&rows[i].some(c=>/value|amount|quantity|shares|qty/i.test(c))){hi=i;break}}
  let ci={sym:0,qty:1,val:2,name:-1};
  if(hi>=0){const h=rows[hi],f=re=>h.findIndex(c=>re.test(c.trim()));
    ci={sym:f(/^(symbol|ticker)$/i),name:f(/description|^name$|security/i),qty:f(/quantity|shares|qty/i),val:f(/market value|current value|total value|^value$|^amount$|value/i)};
    if(ci.sym<0||ci.val<0)return [];}
  const out=[];rows.slice(hi+1).forEach(r=>{
    const sym=(r[ci.sym]||'').trim().toUpperCase(),val=moneyCell(r[ci.val]);
    if(!sym||!(val>0)||/^(TOTAL|TOTALS|ACCOUNT TOTAL|CASH)$/.test(sym)||/^total/i.test(sym))return;
    const qty=ci.qty>=0?Number(String(r[ci.qty]||'').replace(/[,\s]/g,'')):NaN;
    out.push({sym:sym.slice(0,12),name:ci.name>=0?(r[ci.name]||'').trim().slice(0,60):'',qty:Number.isFinite(qty)?qty:0,val});
  });
  return out;
}
function setHoldings(a,list,msg){
  const snap=snapshot();a.hold=list;a.cents=sum(list.map(h=>h.val));a.auto=list.length>0;a.upd=todayISO;recordSnap();commit();toast(msg||`${list.length} holding${list.length===1?'':'s'} saved. ${a.name} is now ${fmt(a.cents)}.`,snap);
}

      <div class="incrow" style="flex-wrap:wrap;border-top:0"><input type="text" id="h-sym" placeholder="Symbol" maxlength="12" style="width:90px" aria-label="Symbol"><input type="number" id="h-qty" min="0" step="any" placeholder="Shares" style="width:90px" aria-label="Number of shares"><span>$<input type="number" id="h-val" min="0" step="0.01" placeholder="Value" style="width:110px" aria-label="Value in dollars"></span><button class="btn small primary" type="button" data-act="addhold" data-id="${a.id}">Add holding</button></div>
      <p class="meta" style="margin:8px 0 4px">Or import a holdings CSV (columns like Symbol, Quantity, Value). This replaces the holdings above.</p>
      <div class="actions"><input type="file" id="hfile" data-acct="${a.id}" accept=".csv,.txt,text/csv" aria-label="Holdings CSV file"></div>
      <textarea id="h-csv" placeholder="or paste CSV text here" aria-label="Holdings CSV text" style="min-height:70px"></textarea>
      <div class="actions"><button class="btn small" type="button" data-act="imphold" data-id="${a.id}">Import pasted text</button><button class="btn small ghost" type="button" data-act="acctholds" data-id="${a.id}">Close</button></div></div>`:'';
    return `<div class="incrow"><span>${esc(a.name)} <span class="meta">${a.inst?esc(a.inst)+' · ':''}${esc(kindOf(a.kind)[1])} · updated ${fd(a.upd||todayISO)}</span></span><span>${amt}</span></div>
      <div class="incrow" style="border-top:0;padding-top:0"><span>${isInv?`<button class="btn small" type="button" data-act="acctholds" data-id="${a.id}">${open?'Hide holdings':(n?`Holdings (${n})`:'Add holdings')}</button>`:''}</span><button class="btn small ghost" type="button" data-act="rmacct" data-id="${a.id}" aria-label="Remove ${esc(a.name)}">Remove</button></div>${holds}`;
  };
  const cards=groups.map(([c,t])=>{const list=accts().filter(a=>acctClass(a)===c);return list.length?`<section class="card" style="margin-bottom:12px"><h3>${t}</h3>${list.map(row).join('')}</section>`:''}).join('');
  return `<p class="lede">Enter what you have in each account. Update a balance whenever you like, monthly is plenty. Itemwise does not connect to banks or brokerages yet, so these stay as accurate as you keep them.</p>
  <section class="card" style="margin-bottom:12px"><div class="two"><div><div class="meta">Assets</div><div class="amt" style="font-size:18px">${fmt(T.assets)}</div></div><div><div class="meta">Owed</div><div class="amt" style="font-size:18px">${fmt(T.debt)}</div></div></div><div style="margin-top:8px"><div class="meta">Net worth</div><div class="amt" style="font-size:22px">${fmt(T.net)}</div></div></section>
  ${cards||'<section class="card" style="margin-bottom:12px"><p class="meta" style="margin:0">No accounts yet. Add your first one below.</p></section>'}
  <section class="card"><h3>Add an account</h3><div class="incrow" style="flex-wrap:wrap;border-top:0"><input type="text" id="an-name" maxlength="40" placeholder="Name, like E*TRADE" aria-label="Account name" style="flex:1;min-width:140px"><input type="text" id="an-inst" maxlength="40" placeholder="Bank or broker (optional)" aria-label="Institution" style="flex:1;min-width:140px"></div>
  <div class="incrow" style="flex-wrap:wrap;border-top:0"><select id="an-kind" aria-label="Account type">${kopts}</select><span>$<input type="number" id="an-bal" min="0" step="0.01" placeholder="Balance" style="width:120px" aria-label="Balance in dollars"></span><button class="btn small primary" type="button" data-act="addacct">Add account</button></div>
  <p class="meta">For cards and loans, enter the amount you owe as a positive number.</p></section>`;
}

const bar=(pct,color)=>`<div role="img" aria-label="${Math.round(pct)}%" style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px"><div style="width:${Math.max(0,Math.min(100,pct))}%;height:100%;background:${color||'var(--accent)'}"></div></div>`;
const wcard=(t,body)=>`<section class="card" style="margin-bottom:12px"><h3>${t}</h3>${body}</section>`;
const needAcct=()=>`<p class="meta" style="margin:6px 0 0">Add your accounts first. <a href="#accounts">Open accounts</a></p>`;
const daysAgo=d=>Math.round((new Date(todayISO+'T12:00:00Z')-new Date(d+'T12:00:00Z'))/864e5);
const WIDGETS={
  available:{t:'Money available',d:'Cash on hand and what is free after this month’s plan',r(){
    const T=acctTotals(),cash=accts().filter(a=>acctClass(a)==='cash');if(!cash.length)return wcard('Money available',needAcct());
    const st=stats(),left=Math.max(0,plannedSpend(curMonth)-st.inBudgets),free=T.cash-left,old=Math.max(...cash.map(a=>daysAgo(a.upd||todayISO)));
    return wcard('Money available',`<div class="two"><div><div class="meta">Cash on hand</div><div class="amt" style="font-size:22px">${fmt(T.cash)}</div></div><div><div class="meta">Free after this month’s plan</div><div class="amt" style="font-size:22px">${fmt(free)}</div></div></div><p class="meta" style="margin:8px 0 0">${fmt(left)} of ${monthLabel(curMonth)}’s planned spending is still to go.${old>7?` Balances were last updated ${old} days ago. <a href="#accounts">Update</a>`:''}</p>`)}},
  networth:{t:'Net worth',d:'Assets minus what you owe, and change since last month',r(){
    if(!accts().length)return wcard('Net worth',needAcct());
    const T=acctTotals(),prev=(S.snaps||[]).filter(x=>daysAgo(x.d)>=25).pop(),pn=prev?prev.cash+prev.inv+prev.oth-prev.debt:null;
    const ch=pn===null?'No earlier balance to compare yet.':`${T.net-pn>=0?'▲':'▼'} ${fmt(Math.abs(T.net-pn))} since ${fd(prev.d)}.`;
    return wcard('Net worth',`<div class="amt" style="font-size:26px">${fmt(T.net)}</div><div class="two" style="margin-top:8px"><div><div class="meta">Assets</div><div class="amt">${fmt(T.assets)}</div></div><div><div class="meta">Owed</div><div class="amt">${fmt(T.debt)}</div></div></div><p class="meta" style="margin:8px 0 0">${ch}</p>`)}},
  nwchart:{t:'Net worth over time',d:'A line of your net worth from saved balances',r(){
    const pts=(S.snaps||[]).slice(-36).map(x=>({d:x.d,v:x.cash+x.inv+x.oth-x.debt}));
    if(pts.length<2)return wcard('Net worth over time',`<p class="meta" style="margin:6px 0 0">The chart starts once you have saved balances on two different days. Update your accounts now and again.</p>`);

    case 'dashup':case 'dashdown':{const l=dashList().slice(),w=b.dataset.w,i=l.indexOf(w),j=a==='dashup'?i-1:i+1;if(i<0||j<0||j>=l.length)break;[l[i],l[j]]=[l[j],l[i]];S.dash={preset:'custom',list:l};commit();break}
    case 'tbl':showTbl=!showTbl;render();break;
    case 'afilter':actFilter=b.dataset.f;render();break;
    case 'menu':menuId=(menuId===id?null:id);render();break;
    case 'confirmguess':confirmGuesses();break;
    case 'defaultall':defaultMixed();break;
    case 'goto-import':location.hash='#import';break;
    case 'goto-add':addOpen=true;location.hash='#activity';break;
    case 'addopen':addOpen=true;render();{const d=$('#af-desc');if(d)d.focus()}break;
    case 'addclose':addOpen=false;render();break;
    case 'addgo':addManual();break;
    case 'sample-data':{imp={text:SAMPLE_CSV};readCsv();location.hash='#import';break}
    case 'sample-csv':imp={text:SAMPLE_CSV};readCsv();break;
    case 'readcsv':{imp=imp||{};imp.text=($('#csvtext').value||'');readCsv();break}
    case 'resetimp':imp=null;render();break;
    case 'doimport':doImport();break;
    case 'transfer':{const t=find(id);Object.assign(t,{status:'transfer',allocations:[],manual:true,split:null});commit();toast('Marked as a transfer. It no longer counts as spending.');break}
    case 'untransfer':{const t=find(id);Object.assign(t,{noRule:true,manual:true,allocations:[],split:null,status:t.cents>0?'review':'credit'});commit();toast(t.cents>0?'Counted as spending again. Choose its category in Review.':'No longer a transfer. It now shows as money in.');break}
    case 'refund':{const t=find(id);Object.assign(t,{status:'review',allocations:[],manual:true});commit();toast('Moved to Review so you can choose which budget the refund returns to.');break}
    case 'dismiss':{const t=find(id);if(t){const snap=snapshot();S.dismissed=S.dismissed||[];S.dismissed.push({date:t.date,desc:t.desc,cents:t.cents});S.txs=S.txs.filter(x=>x.id!==id);if(openId===id)closeEditor();commit();toast(`Removed ${niceName(t.desc)} (${fmt(t.cents)}). It will not come back if you import the same file.`,snap)}break}
    case 'del':{if(delId===id){S.txs=S.txs.filter(t=>t.id!==id);delId=null;if(openId===id)closeEditor();commit();toast('Charge removed.')}else{delId=id;render()}break}
    case 'addrule':{const p=normKey($('#newpat').value),mode=$('#newmode').value;if(!p){toast('Enter the text to match.');break}if(S.rules.some(r=>r.pattern===p)){toast('That rule already exists.');break}S.rules.push({id:++S.seq,pattern:p,mode,cat:mode==='transfer'?'':$('#newcat').value});reeval();commit();toast('Rule added and applied to charges you have not handled yet.');break}
    case 'rmrule':S.rules=S.rules.filter(r=>r.id!==id);reeval();commit();break;
    case 'unlearn':delete S.learned[b.dataset.name];commit();break;
    case 'addcat':{const n=$('#newcatname').value.trim();if(!n){toast('Enter a category name.');break}if(S.cats.some(c=>c.toLowerCase()===n.toLowerCase())){toast('That category exists.');break}S.cats.push(n);const gsel=$('#newcatgroup'),gn=gsel?gsel.value:'Other';let gg=S.groups.find(x=>x.name===gn);if(!gg){gg={name:gn,cats:[]};S.groups.push(gg)}gg.cats.push(n);S.budgets[n]=0;commit();break}
    case 'rmcat':{const n=b.dataset.name;S.cats=S.cats.filter(c=>c!==n);S.groups.forEach(g=>{g.cats=g.cats.filter(c=>c!==n)});delete S.budgets[n];if(S.track)delete S.track[n];Object.values(S.plans||{}).forEach(pl=>{delete pl.budgets[n]});commit();break}
    case 'copybackup':{backupText=JSON.stringify(S);render();const ta=$('#backuptext');if(ta){ta.focus();ta.select()}
      try{navigator.clipboard.writeText(backupText).then(()=>toast('Backup copied. Paste it somewhere safe.'),()=>toast('Select the text below and copy it.'))}catch(err){toast('Select the text below and copy it.')}break}
    case 'restore':restoreFrom($('#restoretext').value);break;
    case 'wipe':{if(wipe){S=freshState();wipe=false;imp=null;closeEditor();commit();toast('All data deleted.')}else{wipe=true;render()}break}
    case 'wipecancel':wipe=false;render();break;
  }
});
function restoreFrom(text){
  try{const s=JSON.parse(text);if(!(s&&s.v===1&&Array.isArray(s.txs)&&Array.isArray(s.rules)&&Array.isArray(s.cats)&&s.budgets&&s.cfg))throw 0;S=s;S.learned=S.learned||{};migrate();curMonth=null;closeEditor();commit();toast('Backup restored.')}
  catch(e){toast('That is not a valid Itemwise backup.')}
}
document.addEventListener('input',e=>{
  const id=e.target.id;

document.addEventListener('pointermove',e=>{
  const w=e.target.closest&&e.target.closest('.lcwrap'),tip=$('#lctip'),x=$('#lcx');
  if(!w||!lcData||!tip||!x){if(tip)tip.classList.remove('on');if(x)x.setAttribute('opacity','0');return}

  const vx=(e.clientX-r.left)/r.width*L.W;

  x.setAttribute('x1',px);x.setAttribute('x2',px);x.setAttribute('opacity','.35');

  tip.innerHTML=`<b>${monthShort(L.month)} ${d}</b><br>Spent ${fmt(L.cum[d])}${L.cum[d]>L.budget&&L.budget>0?' (over budget)':''}<br>Budget ${fmt(L.budget)}${pace}`;
  const pct=px/L.W*100;tip.style.left=Math.min(88,Math.max(12,pct))+'%';tip.classList.add('on');
});
document.addEventListener('change',e=>{
  const el=e.target,id=el.id,d=el.dataset;
  if(d.acctbal!==undefined){const a=accts().find(x=>x.id===+d.acctbal),v=parseMoney(el.value);if(a&&!Number.isNaN(v)&&v>=0){const snap=snapshot();a.cents=v;a.upd=todayISO;editAcct=null;recordSnap();commit();toast(`${a.name} is now ${fmt(v)}.`,snap)}return}
  if(id==='hfile'){const f=el.files&&el.files[0],a=accts().find(x=>x.id===+d.acct);if(!f||!a)return;const r=new FileReader();r.onload=()=>{const l=parseHoldings(String(r.result));if(!l.length){toast('No holdings found. The file needs Symbol and Value columns.');return}setHoldings(a,l)};r.onerror=()=>toast('That file could not be read.');r.readAsText(f);return}
  if(d.rollbase!==undefined){const v=el.value===''?0:parseMoney(el.value);if(!Number.isNaN(v)&&v>=0){S.track=S.track||{};const tr=S.track[d.rollbase];if(tr&&tr.roll){tr.rollBase=v;commit();toast(v>0?`Starting balance for ${d.rollbase} set to ${fmt(v)}.`:'Starting balance cleared.')}}return}
  if(d.cmove!==undefined){normGroups();const from=S.groups.find(g=>g.cats.includes(d.cmove)),to=S.groups.find(g=>g.name===el.value);if(from&&to&&from!==to){from.cats=from.cats.filter(c=>c!==d.cmove);to.cats.push(d.cmove);S.groups=S.groups.filter(g=>g.cats.length);commit();toast(`${d.cmove} moved to ${el.value}.`)}return}
  if(d.dsc!==undefined&&dsplit){dsplit.rows[+d.dsc].cat=el.value;render();return}
  if(d.dsa!==undefined&&dsplit){dsplit.rows[+d.dsa].amt=el.value;render();return}
  if(d.roll!==undefined){
    const c=d.roll;S.track=S.track||{};const tr=S.track[c]=S.track[c]||{};
    if(el.checked){tr.roll=true;tr.rollFrom=tr.rollFrom||todayKey}else{tr.roll=false;delete tr.rollFrom}
    if(!tr.roll&&!tr.goal)delete S.track[c];
    commit();return}
  if(id==='af-cat'){addF.cat=el.value;return}
  if(id==='af-date'){addF.date=el.value;return}
  if(d.aftype!==undefined){addF.type=el.value;return}
  if(id==='csvfile'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imp={text:String(r.result)};readCsv()};r.onerror=()=>toast('That file could not be read.');r.readAsText(f);return}
  if(id==='restorefile'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(String(r.result));r.readAsText(f);return}
  if(id==='rcpt-img'){const f=el.files&&el.files[0];el.value='';if(f)scanReceipt(f);return}
  if(id==='rcimgs'){const fs=[...(el.files||[])];el.value='';if(fs.length)rcRun(fs);return}
  if(d.gcat){const t=find(+d.gcat);if(t)t.allocations=[{cat:el.value,cents:t.cents}];commit();return}
  if(d.map!==undefined&&imp){imp.map[d.map]=+el.value;render();return}
  if(d.mode!==undefined&&imp){imp.mode=el.value;render();return}
  if(d.sign!==undefined&&imp){imp.negIsSpend=el.value==='neg';render();return}
  if(d.line!==undefined&&draft){const l=draft.lines[+d.line];l.cat=el.value;l.tag='';if(l.cat==='Grocery')l.taxable=false;render();return}
  if(id==='add-cat'&&draft){draft.add=draft.add||{};draft.add.cat=el.value;return}
  if(id==='add-tax'&&draft){draft.add=draft.add||{};draft.add.taxable=el.checked;return}
  if(id==='remember'&&draft){draft.remember=el.checked;return}
  if(id==='asknext'&&draft){draft.askNext=el.checked;return}
  if(id==='taxin'&&draft){const c=parseMoney(el.value);if(!(c>=0)){toast('Enter tax as a dollar amount, like 7.21.');render();return}draft.tax=c;render();return}
  if(d.actcat){const t=find(+d.actcat);if(t&&el.value){const snap=snapshot();Object.assign(t,{allocations:[{cat:el.value,cents:t.cents}],status:'done',manual:true,split:null});commit();toast(`${niceName(t.desc)} filed under ${el.value}.`,snap)}return}
  if(d.inc!==undefined){const v=parseMoney(el.value);if(!Number.isNaN(v)&&v>=0)ownPlan(curMonth).income[+d.inc].cents=v;editInc=null;commit();return}
  if(d.budget){const v=parseMoney(el.value);if(!Number.isNaN(v)&&v>=0)ownPlan(curMonth).budgets[d.budget]=v;editB=null;commit();return}
  if(id==='thr'){const c=parseMoney(el.value);if(c>=0)S.cfg.threshold=c;reeval();commit();toast('Review list updated for the new limit.');return}
  if(d.rpat){const r=S.rules.find(x=>x.id===+d.rpat);const p=normKey(el.value);if(r&&p)r.pattern=p;reeval();commit();return}
  if(d.rmode){const r=S.rules.find(x=>x.id===+d.rmode);if(r){r.mode=el.value;if(r.mode!=='transfer'&&!r.cat)r.cat=S.cats[0]}reeval();commit();return}
  if(d.rgas){const r=S.rules.find(x=>x.id===+d.rgas);if(r)r.gas=el.checked;commit();return}
  if(d.rcat){const r=S.rules.find(x=>x.id===+d.rcat);if(r)r.cat=el.value;reeval();commit();return}
});
function route(){
  const h=location.hash.slice(1);
  view=VIEWS.some(v=>v[0]===h)?h:((S.txs.length||(S.accts&&S.accts.length))?'overview':'review');
  closeEditor();delId=null;wipe=false;render();
  if(pend){

route();

<script id="sync">
/* Optional cloud sync through the page's private per-person database. The app works the same without it. */
const SY={state:'off',err:'',ser:{},col:null,pushing:false,dirty:false,timer:null,first:true,last:null,defer:null,hold:null,uid:null,retry:null};
const SYKEY='itemwise.sync',SYDIRTY='itemwise.syncdirty',CHUNK=120000;
function syncOn(){return SY.state==='synced'||SY.state==='saving'}
function lget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lset(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function syPieces(St){
  const {txs,...meta}=St,out={meta:JSON.stringify(meta)},by={};
  txs.forEach(t=>{const m=t.date.slice(0,7);(by[m]=by[m]||[]).push(t)});
  Object.keys(by).forEach(m=>{
    let cur=[],len=2,n=0;
    const flush=()=>{out['tx-'+m+'-'+n]=JSON.stringify(cur);n++;cur=[];len=2};
    by[m].forEach(t=>{const j=JSON.stringify(t);if(cur.length&&len+j.length>CHUNK)flush();cur.push(t);len+=j.length+1});
    if(cur.length)flush();
  });
  return out;
}
function syUI(){
  const tag=document.getElementById('tag');if(!tag)return;
  tag.textContent={off:'Your data stays in this browser. No bank link, no account.',connecting:'Connecting sync…',synced:'Synced to your account, so phone and computer match. No bank link.',saving:'Saving…',conflict:'Choose which data to keep (see below).',error:'Sync paused. Changes are kept on this device and will upload when it reconnects.'}[SY.state]||'';
}
function sySet(st,err){SY.state=st;SY.err=err||'';syUI();if(typeof renderNotice==='function'){renderNotice()}}
function syncCard(){
  const m={off:'Not available here, so your data stays in this browser.',connecting:'Connecting…',synced:'On. Everything is up to date.',saving:'Saving changes…',conflict:'Waiting for your choice at the top of the page.',error:'Paused. '+(SY.err||'Changes are safe on this device and will upload when the connection returns.')}[SY.state];
  return `<section class="card" style="margin-bottom:12px"><h3>Sync across devices</h3><p class="meta" style="margin:4px 0 0" id="syncmsg">${esc(m)}</p></section>`;
}
function conflictHTML(){
  if(SY.state!=='conflict')return '';
  return `<div class="notice" style="background:var(--surface);border:1px solid var(--line);color:var(--ink)"><strong>Your account already has Itemwise data, and this browser has different data.</strong><p style="margin:6px 0 10px">Pick the one to keep. The other is replaced here, and this browser's copy is saved as a backup first.</p><div class="actions"><button class="btn primary" type="button" data-sync="cloud">Use the data from my account</button><button class="btn" type="button" data-sync="mine">Use this browser's data</button></div></div>`;
}
function syBusy(){const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!=='file'&&a.value!==a.defaultValue)}   // only hold off while someone is mid-typing
function syncSoon(){
  if(!SY.col)return;
  SY.dirty=true;lset(SYDIRTY,'1');
  clearTimeout(SY.timer);SY.timer=setTimeout(syPush,700);
}
async function syPush(){
  if(!SY.col||SY.pushing||SY.state==='conflict')return;
  SY.pushing=true;sySet('saving');
  try{
    do{
      SY.dirty=false;
      const P=syPieces(S);
      Object.keys(SY.ser).forEach(id=>{if(!(id in P))P[id]='[]'});   // emptied chunks are blanked, never deleted
      for(const id of Object.keys(P)){
        const prev=SY.ser[id];
        if(prev&&prev.j===P[id])continue;
        if(!prev&&P[id]==='[]')continue;
        const t=Math.max(Date.now(),(prev?prev.t:0)+1);
        await SY.col.doc(id).set({j:P[id],t});
        SY.ser[id]={j:P[id],t};
      }
    }while(SY.dirty);
    lset(SYDIRTY,null);lset(SYKEY,SY.uid);
    sySet('synced');
  }catch(e){
    const code=e&&e.code;
    sySet('error',code==='quota_exceeded'?'Storage is full.':(code==='invalid_argument'?'This account can view but not save changes here.':''));
    if(code==='unavailable'||!code){clearTimeout(SY.retry);SY.retry=setTimeout(syPush,20000)}
  }finally{SY.pushing=false}
  if(SY.state==='synced'&&SY.last)syReconcile(SY.last);
}
function syApply(remote){
  const meta=JSON.parse(remote.meta.j),txs=[];
  Object.keys(remote).filter(id=>id.startsWith('tx-')).sort().forEach(id=>{try{JSON.parse(remote[id].j).forEach(t=>txs.push(t))}catch(e){}});
  meta.txs=txs;
  meta.seq=Math.max(meta.seq||0,1000,...txs.map(t=>t.id),...(meta.rules||[]).map(r=>r.id));
  S=meta;migrate();saveLocal();
  if(openId&&!find(openId))closeEditor();
  render();
}
function syReconcile(remote){
  if(!remote.meta)return;
  let changed=false;
  Object.keys(remote).forEach(id=>{const r=remote[id],m=SY.ser[id];if(!m||(r.j!==m.j&&r.t>m.t))changed=true});
  if(!changed)return;
  if(SY.pushing||SY.dirty)return;                 // our own pending changes go first; we re-check after the push
  if(syBusy()){clearTimeout(SY.defer);SY.defer=setTimeout(()=>syReconcile(SY.last),1500);return}
  const next={};Object.keys(remote).forEach(id=>{next[id]=remote[id]});
  Object.keys(SY.ser).forEach(id=>{if(!(id in next))next[id]=SY.ser[id]});
  // keep our newer copies where we have them
  Object.keys(SY.ser).forEach(id=>{const m=SY.ser[id],r=remote[id];if(r&&m.t>=r.t)next[id]=m});
  SY.ser={};Object.keys(next).forEach(id=>{SY.ser[id]=next[id]});
  syApply(next);
  sySet('synced');
}
function syLocalHasData(){return S.txs.length>0||Object.keys(S.learned||{}).length>0}
function syFirst(remote){
  const hasRemote=!!remote.meta;
  if(!hasRemote){SY.ser={};syPush();return}
  const same=(()=>{try{const P=syPieces(S);return Object.keys(P).every(id=>remote[id]&&remote[id].j===P[id])&&Object.keys(remote).every(id=>id in P||remote[id].j==='[]')}catch(e){return false}})();
  const adopt=()=>{SY.ser={};Object.keys(remote).forEach(id=>{SY.ser[id]=remote[id]});syApply(SY.ser);lset(SYKEY,SY.uid);lset(SYDIRTY,null);sySet('synced')};
  if(same){SY.ser={};Object.keys(remote).forEach(id=>{SY.ser[id]=remote[id]});lset(SYKEY,SY.uid);sySet('synced');return}
  if(!syLocalHasData()){adopt();return}
  if(lget(SYKEY)===SY.uid){ if(lget(SYDIRTY)==='1'){SY.ser={};Object.keys(remote).forEach(id=>{SY.ser[id]=remote[id]});syPush()}else adopt(); return }
  SY.hold=remote;sySet('conflict');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-sync]');if(!b||!SY.hold)return;
  const remote=SY.hold;SY.hold=null;
  lset('itemwise.premerge',JSON.stringify(S));
  if(b.dataset.sync==='cloud'){SY.ser={};Object.keys(remote).forEach(id=>{SY.ser[id]=remote[id]});syApply(SY.ser);lset(SYKEY,SY.uid);lset(SYDIRTY,null);sySet('synced')}
  else{SY.ser={};Object.keys(remote).forEach(id=>{SY.ser[id]=remote[id]});SY.state='connecting';syPush()}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&SY.dirty){clearTimeout(SY.timer);syPush()}});
(async function syInit(){
  try{
    if(!(window.claude&&window.claude.use))return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    SY.uid=String(id);SY.col=db.doc('data/users/'+SY.uid+'/itemwise').collection('s');
    sySet('connecting');
    const guard=setTimeout(()=>{if(SY.first)sySet('error','Could not reach sync yet.')},10000);
    SY.col.onSnapshot(snap=>{
      clearTimeout(guard);
      const remote={};snap.docs.forEach(d=>{const x=d.data();if(x&&typeof x.j==='string')remote[d.id]={j:x.j,t:+x.t||0}});
      SY.last=remote;
      if(SY.first){SY.first=false;syFirst(remote);return}
      if(SY.state==='conflict')return;
      syReconcile(remote);
    },e=>{sySet('error',e&&e.code==='revoked'?'Access changed.':'')});
  }catch(e){}
})();
</script>
